name: Beautiful Jekyll CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true